<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NovaBank Transfer Portal</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header>
    <h1>🏦 NovaBank Transfer Portal</h1>
    <p>Fictional bank · hackathon application</p>
</header>
<main>
    <section class="card">
        <h2>Demo accounts</h2>
        <table>
            <thead><tr><th>Account</th><th>Holder</th><th>Balance</th></tr></thead>
            <tbody>
            <tr th:each="a : ${accounts}">
                <td th:text="${a.accountNumber}">ACC1001</td>
                <td th:text="${a.holderName}">Priya</td>
                <td th:text="${a.currency} + ' ' + ${a.balance}">INR 0</td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="card">
        <h2>Send money</h2>
        <p class="error" th:if="${error}" th:text="${error}">Error</p>
        <form th:action="@{/transfer}" th:object="${transfer}" method="post">
            <label>From account <input type="text" th:field="*{fromAccount}" placeholder="ACC1001" required></label>
            <label>To account <input type="text" th:field="*{toAccount}" placeholder="ACC1002" required></label>
            <label>Amount <input type="number" step="0.01" th:field="*{amount}" required></label>
            <label>PIN <input type="password" th:field="*{pin}" required></label>
            <label>Note <input type="text" th:field="*{note}" maxlength="140"></label>
            <button type="submit">Transfer</button>
        </form>
    </section>
</main>
<footer>NovaBank is fictional. Training application — intentionally insecure.</footer>
</body>
</html>
